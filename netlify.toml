[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

# The Fezer Plus promo API. netlify/functions/promo.mjs declares its own routes
# (/api/promo/*, /api/admin/*, /r/*) through the v2 `config.path` export, so no
# redirects are needed here -- adding some would only shadow that routing.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

[git]
  lfs = true

# All pages are prerendered to static HTML at build time, so no SPA
# rewrites are needed. /privacy is a legacy alias for the policy page.
# /vision is a legacy alias for the about page.
[[redirects]]
  from = "/privacy"
  to = "/privacypolicy"
  status = 301

[[redirects]]
  from = "/vision"
  to = "/about"
  status = 301

# The promo dashboard became a tab on the admin page.
[[redirects]]
  from = "/promo-admin"
  to = "/admin"
  status = 301

# iOS reads this to learn which links open Fezer (fezer.app/scan from a
# Fezer QR code). Apple wants JSON; Netlify serves an extensionless file as
# plain text otherwise.
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"
