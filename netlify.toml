[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

[git]
  lfs = true

# All pages are prerendered to static HTML at build time, so no SPA
# rewrites are needed. /privacy is a legacy alias for the policy page.
[[redirects]]
  from = "/privacy"
  to = "/privacypolicy"
  status = 301
